name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Show Flutter and Dart versions
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        # Unit and widget tests do not load the large, gitignored soundfont.
        run: flutter test --no-test-assets

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release
        env:
          # CI produces an unsigned DMG; signing requires an Apple certificate
          # and private key installed on the runner.
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'

      - name: Create DMG
        run: |
          brew install create-dmg
          APP_NAME="Live Keys"
          APP_PATH="build/macos/Build/Products/Release/${APP_NAME}.app"
          DMG_NAME="${APP_NAME}.dmg"
          
          create-dmg \
            --volname "${APP_NAME}" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "${DMG_NAME}" \
            "${APP_PATH}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: "*.dmg"

  build-windows:
    needs: test
    # universal_ble 0.20.2 still uses the coroutine support provided by VS 2022.
    runs-on: windows-2022
    env:
      FLUIDSYNTH_ROOT: ${{ github.workspace }}\.vcpkg
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Install FluidSynth
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install fluidsynth:x64-windows "--x-install-root=$env:FLUIDSYNTH_ROOT"

          # The current flutter_midi_pro fork contains a developer-machine
          # vcpkg path. Point its generated plugin symlink at the CI install.
          $pluginCmake = "windows/flutter/ephemeral/.plugin_symlinks/flutter_midi_pro/windows/CMakeLists.txt"
          $ciInstall = (Join-Path $env:FLUIDSYNTH_ROOT "x64-windows").Replace('\', '/')
          $content = (Get-Content -Raw $pluginCmake).Replace(
            "C:/Users/erez1/vcpkg/installed/x64-windows",
            $ciInstall
          )
          Set-Content -Path $pluginCmake -Value $content -NoNewline

          # The pinned plugin revision uses flutter::EncodableMap in its
          # public header without including the header that defines the type.
          $pluginHeader = "windows/flutter/ephemeral/.plugin_symlinks/flutter_midi_pro/windows/flutter_midi_pro_plugin.h"
          $header = Get-Content -Raw $pluginHeader
          if (-not $header.Contains("#include <flutter/encodable_value.h>")) {
            $header = $header.Replace(
              "#include <flutter/method_channel.h>",
              "#include <flutter/encodable_value.h>`n#include <flutter/method_channel.h>"
            )
            Set-Content -Path $pluginHeader -Value $header -NoNewline
          }

      - name: Build Windows app
        run: flutter build windows --release

      - name: Bundle FluidSynth runtime
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $env:FLUIDSYNTH_ROOT "x64-windows/bin"
          $releaseDir = "build/windows/x64/runner/Release"
          Copy-Item -Path "$runtimeDir/*.dll" -Destination $releaseDir

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Create Inno Setup script
        run: |
          $version = (Get-Content pubspec.yaml | Select-String -Pattern 'version:\s*([0-9.]+)').Matches.Groups[1].Value
          @"
          #define MyAppName "Live Keys"
          #define MyAppVersion "$version"
          #define MyAppPublisher "Piano App"
          #define MyAppExeName "piano_app.exe"
          
          [Setup]
          AppId={{301283FA-8FFE-49B6-98B4-C641901DF854}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir=installer
          OutputBaseFilename=LiveKeys-Setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          
          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked
          
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          
          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -FilePath "installer.iss" -Encoding UTF8

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/LiveKeys-Setup.exe

  create-release:
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            android-apk/app-release.apk
            macos-dmg/*.dmg
            windows-installer/LiveKeys-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
